name: One-off US Equity M15 Backfill After Session Filter

on:
  push:
    branches:
      - oneoff/us-equity-m15-backfill-filtered-20261121

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BACKTEST_DATA_MODE: download
      BACKTEST_SNAPSHOT_DIR: historicos_us_equity_m15_filtered
      BACKTEST_EXTENDED_INTRADAY_HISTORY: "true"
      BACKTEST_INTRADAY_LOOKBACK_DAYS: "700"
      BACKTEST_ASSETS: "TSLA,NVDA,AAPL,MSFT,TTWO"
      BACKTEST_TIMEFRAMES: "15m"
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

    steps:
      - name: Checkout latest main-based session-filtered code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify provider secret without exposing it
        run: |
          python - <<'PY'
          import os
          if not os.getenv("TWELVE_DATA_API_KEY"):
              raise SystemExit("Missing Actions secret: TWELVE_DATA_API_KEY")
          print("Twelve Data secret is present; value hidden.")
          PY
      - name: Run targeted extended-history backtest
        run: python backtest_v3.py
      - name: Upload exact snapshots and diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-equity-m15-filtered-backfill-2026-11-21
          retention-days: 14
          if-no-files-found: warn
          path: |
            operaciones_backtest_v3.csv
            resultados_backtest_v3.csv
            errores_backtest_v3.csv
            resumen_operaciones_v3.csv
            diagnostico_senales_v3.csv
            velas_ohlc_excluidas_v3.csv
            rechazos_rr_backtest_v3.csv
            senales_solapadas_v3.csv
            costes_backtest_v3.csv
            operaciones_cartera_backtest_v3.csv
            rechazos_cartera_backtest_v3.csv
            resultados_cartera_backtest_v3.csv
            historicos_us_equity_m15_filtered/
