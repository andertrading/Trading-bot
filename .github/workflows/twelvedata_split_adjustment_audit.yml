name: Twelve Data Split Adjustment Audit

on:
  workflow_dispatch:
    inputs:
      confirm_api_usage:
        description: "Confirm two Twelve Data daily requests may consume API credits"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: twelvedata-split-adjustment-audit
  cancel-in-progress: false

jobs:
  no-api:
    if: \${{ inputs.confirm_api_usage != true }}
    runs-on: ubuntu-latest
    steps:
      - name: No API calls made
        run: echo "Audit not run. Re-launch manually and confirm API usage to make two Twelve Data requests."

  audit:
    if: \${{ inputs.confirm_api_usage == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install requests

      - name: Run split adjustment audit
        env:
          TWELVE_DATA_API_KEY: \${{ secrets.TWELVE_DATA_API_KEY }}
        run: python research/twelvedata_split_adjustment_audit.py

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twelvedata-split-adjustment-audit-\${{ github.run_id }}
          path: twelvedata_split_adjustment_audit.json
          if-no-files-found: warn
          retention-days: 90
