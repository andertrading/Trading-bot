name: One-off Full Universe Replay After Risk Fixes

on:
  push:
    branches:
      - oneoff/full-universe-replay-risk-fixes-20261121

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKTEST_DATA_MODE: replay
      BACKTEST_SNAPSHOT_DIR: historicos_backtest_extended

    steps:
      - name: Checkout latest risk-fixed main
        uses: actions/checkout@v4

      - name: Download exact extended-history snapshot artifact
        uses: actions/download-artifact@v4
        with:
          name: extended-intraday-backtest-2026-11-21
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: andertrading/Trading-bot
          run-id: 44862820157
          path: .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify available exact snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("historicos_backtest_extended")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          print("Snapshots:", len(manifest))
          for item in manifest:
              print(item["asset"], item["timeframe"], item["row_count"], item["first_timestamp"], item["last_timestamp"])
          PY

      - name: Replay every available asset and timeframe
        run: python backtest_v3.py

      - name: Upload full-universe replay results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-universe-risk-fixed-replay-2026-11-21
          retention-days: 14
          if-no-files-found: warn
          path: |
            operaciones_backtest_v3.csv
            resultados_backtest_v3.csv
            errores_backtest_v3.csv
            resumen_operaciones_v3.csv
            diagnostico_senales_v3.csv
            velas_ohlc_excluidas_v3.csv
            rechazos_rr_backtest_v3.csv
            senales_solapadas_v3.csv
            costes_backtest_v3.csv
            operaciones_cartera_backtest_v3.csv
            rechazos_cartera_backtest_v3.csv
            resultados_cartera_backtest_v3.csv
