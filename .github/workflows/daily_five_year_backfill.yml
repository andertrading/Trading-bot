name: One-off Five Year Daily History Backfill

on:
  push:
    branches:
      - oneoff/daily-five-year-backfill-20261121

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKTEST_DATA_MODE: download
      BACKTEST_EXTENDED_DAILY_HISTORY: "true"
      BACKTEST_DAILY_LOOKBACK_DAYS: "1825"
      BACKTEST_SNAPSHOT_DIR: historicos_daily_5y
      BACKTEST_TIMEFRAMES: "1d"
      BACKTEST_ASSETS: "CSPX,CNDX,TSLA,NVDA,AAPL,MSFT,TTWO,BTC,ETH,SOL,XLM,XRP"

    steps:
      - name: Checkout risk-fixed main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required provider secret exists
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          if [ -z "$TWELVE_DATA_API_KEY" ]; then
            echo "TWELVE_DATA_API_KEY secret is missing."
            exit 1
          fi
          echo "Twelve Data secret is present; value is not printed."

      - name: Download and backtest five years of daily history
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python backtest_v3.py

      - name: Upload five-year daily snapshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-five-year-backtest-2026-11-21
          retention-days: 14
          if-no-files-found: warn
          path: |
            historicos_daily_5y/**
            operaciones_backtest_v3.csv
            resultados_backtest_v3.csv
            errores_backtest_v3.csv
            resumen_operaciones_v3.csv
            diagnostico_senales_v3.csv
            velas_ohlc_excluidas_v3.csv
            rechazos_rr_backtest_v3.csv
            senales_solapadas_v3.csv
            costes_backtest_v3.csv
            operaciones_cartera_backtest_v3.csv
            rechazos_cartera_backtest_v3.csv
            resultados_cartera_backtest_v3.csv
