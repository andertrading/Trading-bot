
name: Trading Bot 3.0 - Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar todas las pruebas
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m unittest test_indicators -v

      - name: Comprobar arranque de Bot.py
        run: |
          python - <<'PY'
          import Bot

          assert Bot.app is not None

          client = Bot.app.test_client()

          response = client.get("/")
          assert response.status_code == 200, response.status_code

          response = client.get("/health")
          assert response.status_code == 200, response.status_code

          print("OK: Bot.py arranca y las rutas principales responden.")
          PY
