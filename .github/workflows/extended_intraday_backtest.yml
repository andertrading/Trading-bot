name: One-off Extended Intraday Backtest

on:
  push:
    branches:
      - oneoff/extended-intraday-backtest-20261121

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BACKTEST_DATA_MODE: download
      BACKTEST_SNAPSHOT_DIR: historicos_backtest_extended
      BACKTEST_EXTENDED_INTRADAY_HISTORY: "true"
      BACKTEST_INTRADAY_LOOKBACK_DAYS: "700"
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}

    steps:
      - name: Checkout extended-history code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify configuration without exposing secrets
        run: |
          python - <<'PY'
          import os
          required = ("TWELVE_DATA_API_KEY", "EODHD_API_KEY")
          missing = [key for key in required if not os.getenv(key)]
          if missing:
              raise SystemExit("Missing Actions secrets: " + ", ".join(missing))
          print("Provider secrets are present.")
          print("Extended intraday history:", os.environ["BACKTEST_EXTENDED_INTRADAY_HISTORY"])
          print("Lookback days:", os.environ["BACKTEST_INTRADAY_LOOKBACK_DAYS"])
          PY

      - name: Run extended current-provider backtest
        run: python backtest_v3.py

      - name: Upload extended snapshots and reproducible results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extended-intraday-backtest-2026-11-21
          retention-days: 14
          if-no-files-found: warn
          path: |
            operaciones_backtest_v3.csv
            resultados_backtest_v3.csv
            errores_backtest_v3.csv
            resumen_operaciones_v3.csv
            diagnostico_senales_v3.csv
            velas_ohlc_excluidas_v3.csv
            rechazos_rr_backtest_v3.csv
            senales_solapadas_v3.csv
            costes_backtest_v3.csv
            operaciones_cartera_backtest_v3.csv
            rechazos_cartera_backtest_v3.csv
            resultados_cartera_backtest_v3.csv
            historicos_backtest_extended/
