name: Research Strategy Variants, Broker Fees and Walk Forward

on:
  push:
    branches:
      - research/fixed-common-calendar-oos-20261121
      - research/explicit-universe-coverage-20261121
      - research/broker-cost-sensitivity-20261121
      - research/history-calendar-audit-20261121

permissions:
  contents: read
  actions: read

concurrency:
  group: strategy-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BACKTEST_DATA_MODE: replay
      BACKTEST_SNAPSHOT_DIR: historicos_full_merged
      BACKTEST_DAILY_LOOKBACK_DAYS: "730"
      BACKTEST_EXTENDED_DAILY_HISTORY: "false"

    steps:
      - name: Checkout research-only strategy harness
        uses: actions/checkout@v4

      - name: Download original extended universe snapshots
        uses: actions/download-artifact@v4
        with:
          name: extended-intraday-backtest-2026-11-21
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: andertrading/Trading-bot
          run-id: 44862820157
          path: sources/base

      - name: Download corrected US equity M15 snapshots
        uses: actions/download-artifact@v4
        with:
          name: us-equity-m15-filtered-backfill-2026-11-21
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: andertrading/Trading-bot
          run-id: 44896519696
          path: sources/stocks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Recover missing SOL 15m snapshot from Coinbase USD history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import backtest_v3
          import data_engine

          source_dir = Path("sources/base/historicos_backtest_extended")
          manifest_path = source_dir / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          if any(
              item.get("asset") == "SOL" and item.get("timeframe") == "15m"
              for item in manifest
          ):
              print("SOL 15m already exists in the source manifest; no replacement.")
              raise SystemExit(0)

          frame = data_engine._download_coinbase_crypto_history(
              "SOL", lookback_days=700
          )
          if frame is None or frame.empty:
              raise SystemExit(
                  "Coinbase SOL-USD 15m history is incomplete or invalid; "
                  "the universe remains explicitly partial."
              )

          backtest_v3.SNAPSHOT_DIR = source_dir
          backtest_v3.SNAPSHOT_MANIFEST = list(manifest)
          metadata = backtest_v3._save_snapshot(
              "SOL", "SOL-USD", "15m", frame
          )
          if (
              not metadata
              or metadata.get("row_count", 0) < 60000
              or metadata.get("provider") != "coinbase_exchange"
          ):
              raise SystemExit("SOL 15m snapshot metadata validation failed.")
          backtest_v3._write_snapshot_manifest()
          print(
              "SOL 15m recovered:",
              metadata["row_count"],
              metadata["first_timestamp"],
              "->",
              metadata["last_timestamp"],
              "| provider=",
              metadata["provider"],
          )
          PY

      - name: Probe current market-data provider timestamps
        continue-on-error: true
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          key = os.environ.get("TWELVE_DATA_API_KEY")
          if not key:
              raise SystemExit("TWELVE_DATA_API_KEY secret is missing")
          now = datetime.now(timezone.utc)
          results = []

          def get_json(url, params):
              request = Request(
                  url + "?" + urlencode(params),
                  headers={"User-Agent": "TradingBot-Research-Freshness/1.0"},
              )
              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def record(label, provider, stamp, threshold_hours):
              latest = datetime.fromisoformat(str(stamp).replace("Z", "+00:00"))
              if latest.tzinfo is None:
                  latest = latest.replace(tzinfo=timezone.utc)
              latest = latest.astimezone(timezone.utc)
              age = (now - latest).total_seconds() / 3600
              fresh = age <= threshold_hours
              results.append({
                  "series": label, "provider": provider,
                  "latest_timestamp_utc": latest.isoformat(),
                  "age_hours": round(age, 2),
                  "threshold_hours": threshold_hours, "fresh": fresh,
              })
              print(
                  f"{label}: {latest.isoformat()} age={age:.2f}h "
                  f"threshold={threshold_hours}h status={'FRESH' if fresh else 'STALE'}"
              )

          for i, (label, symbol, interval, threshold) in enumerate([
              ("AAPL 15m", "AAPL", "15min", 72),
              ("AAPL 1d", "AAPL", "1day", 96),
              ("BTC 15m", "BTC/USD", "15min", 0.75),
              ("BTC 1d", "BTC/USD", "1day", 48),
          ]):
              try:
                  payload = get_json(
                      "https://api.twelvedata.com/time_series",
                      {
                          "symbol": symbol, "interval": interval,
                          "outputsize": 2, "timezone": "UTC", "apikey": key,
                      },
                  )
                  values = payload.get("values") or []
                  if not values or not values[0].get("datetime"):
                      raise ValueError(
                          f"no provider timestamp; code={payload.get('code')} "
                          f"message={payload.get('message')}"
                      )
                  record(label, "Twelve Data", values[0]["datetime"], threshold)
              except Exception as exc:
                  results.append({
                      "series": label, "provider": "Twelve Data",
                      "fresh": False, "error": f"{type(exc).__name__}: {exc}",
                  })
                  print(f"{label}: PROVIDER ERROR {type(exc).__name__}: {exc}")
              if i < 3:
                  time.sleep(9)

          for label, symbol, interval, threshold, days in [
              ("CSPX 15m", "CSPX.L", "15m", 72, 55),
              ("CSPX 1d", "CSPX.L", "1d", 96, 400),
          ]:
              try:
                  payload = get_json(
                      f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}",
                      {
                          "period1": int(now.timestamp() - days * 86400),
                          "period2": int(now.timestamp()),
                          "interval": interval, "events": "history",
                          "includeAdjustedClose": "true",
                      },
                  )
                  chart = payload.get("chart") or {}
                  series = chart.get("result") or []
                  timestamps = series[0].get("timestamp") if series else None
                  if chart.get("error") or not timestamps:
                      raise ValueError("Yahoo returned no usable timestamps")
                  latest = datetime.fromtimestamp(timestamps[-1], timezone.utc)
                  record(label, "Yahoo Finance", latest.isoformat(), threshold)
              except Exception as exc:
                  results.append({
                      "series": label, "provider": "Yahoo Finance",
                      "fresh": False, "error": f"{type(exc).__name__}: {exc}",
                  })
                  print(f"{label}: PROVIDER ERROR {type(exc).__name__}: {exc}")

          report = {
              "generated_at_utc": now.isoformat(),
              "status": "FRESH" if all(row["fresh"] for row in results) else "STALE",
              "results": results,
          }
          with open("provider_freshness.json", "w", encoding="utf-8") as output:
              json.dump(report, output, indent=2)
          print("Provider freshness summary:", report["status"])
          PY


      - name: Merge immutable snapshots and compile research harness
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          base = Path("sources/base/historicos_backtest_extended")
          stocks = Path("sources/stocks/historicos_us_equity_m15_filtered")
          destination = Path("historicos_full_merged")
          destination.mkdir(parents=True, exist_ok=True)

          base_manifest = json.loads((base / "manifest.json").read_text(encoding="utf-8"))
          stock_manifest = json.loads((stocks / "manifest.json").read_text(encoding="utf-8"))
          combined = list(base_manifest)
          existing = {(item["asset"], item["timeframe"]) for item in combined}

          for item in stock_manifest:
              key = (item["asset"], item["timeframe"])
              if key in existing:
                  raise SystemExit(f"Duplicate snapshot: {key}")
              combined.append(item)
              existing.add(key)

          for source in (base, stocks):
              for path in source.iterdir():
                  if path.name != "manifest.json":
                      shutil.copy2(path, destination / path.name)

          from config import ASSETS

          expected = {
              (asset, timeframe)
              for asset, settings in ASSETS.items()
              if isinstance(settings, dict)
              for timeframe in ("15m", "1d")
          }
          available = {(item["asset"], item["timeframe"]) for item in combined}
          missing = sorted(expected - available)
          unexpected = sorted(available - expected)
          coverage = {
              "status": "COMPLETE" if not missing and not unexpected else "PARTIAL",
              "expected_combinations": len(expected),
              "available_combinations": len(expected & available),
              "missing_combinations": [
                  {"asset": asset, "timeframe": timeframe}
                  for asset, timeframe in missing
              ],
              "unexpected_combinations": [
                  {"asset": asset, "timeframe": timeframe}
                  for asset, timeframe in unexpected
              ],
          }
          (destination / "manifest.json").write_text(
              json.dumps(combined, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          Path("snapshot_coverage.json").write_text(
              json.dumps(coverage, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print("Snapshot universe coverage:", json.dumps(coverage))
          if not combined:
              raise SystemExit("No snapshots available for research")
          PY
          python -m py_compile strategy_research.py
          python -m unittest discover -s tests -p "test_data_engine.py" -v
          python -m unittest discover -s tests -p "test_strategy_research.py" -v
          python -m unittest discover -s tests -p "test_portfolio_backtest.py" -v
          python -m unittest discover -s tests -p "test_transaction_costs.py" -v

      - name: Run fixed strategy hypotheses with chronological walk-forward split
        run: python strategy_research.py

      - name: Upload research metrics and trade logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-variants-walkforward-2026-11-21
          retention-days: 14
          if-no-files-found: warn
          path: |
            strategy_research_summary.csv
            strategy_research_walkforward.csv
            strategy_research_trades.csv
            strategy_research_errors.csv
            strategy_research_portfolio.csv
            strategy_research_oos_portfolio.csv
            strategy_research_coverage.csv
            strategy_research_status.json
            snapshot_coverage.json
            strategy_research_broker_cost_scenarios.csv
            strategy_research_history_calendar_coverage.csv
            strategy_research_synchronized_broker_cost_scenarios.csv
            strategy_research_net_aware_portfolio.csv
            strategy_research_synchronized_calendar.csv
            provider_freshness.json
