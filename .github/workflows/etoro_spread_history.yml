name: eToro Forward Spread History Audit (Read-Only)

on:
  push:
    branches:
      - main
    paths:
      - etoro_spread_history.py
      - .github/workflows/etoro_spread_history.yml
  schedule:
    # Run after the market snapshot window, away from the top of the hour.
    - cron: "23 16 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: etoro-forward-spread-history
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install minimal dependency
        run: python -m pip install requests==2.32.4
      - name: Aggregate read-only forward spread snapshots
        run: |
          python etoro_spread_history.py \
            --repo "$GITHUB_REPOSITORY" \
            --lookback-days 90 \
            --min-sessions 30 \
            --output artifacts/etoro_spread_history.json
      - name: Upload spread history audit
        if: always() && hashFiles('artifacts/etoro_spread_history.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: etoro-forward-spread-history
          path: artifacts/etoro_spread_history.json
          if-no-files-found: error
          retention-days: 90
