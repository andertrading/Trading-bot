name: Trading Bot 3.0 - ETF Paper Data Capture

on:
  schedule:
    # After the London cash session close in both winter and summer.
    - cron: "35 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-bot-etf-paper-data-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate required credentials without revealing values
        run: |
          python - <<'PY'
          import os
          missing = [
              name for name in (
                  "EODHD_API_KEY",
                  "UPSTASH_REDIS_REST_URL",
                  "UPSTASH_REDIS_REST_TOKEN",
              )
              if not os.getenv(name)
          ]
          if missing:
              raise SystemExit("Missing required secrets: " + ", ".join(missing))
          print("Required credentials are present; values hidden.")
          PY
      - name: Capture validated daily ETF bars
        run: python research/etf_paper_capture.py
      - name: Upload sanitized capture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-paper-capture-report
          path: etf_paper_capture/capture_report.json
          if-no-files-found: warn
          retention-days: 30
