
name: Twelve Data - ETF Symbol Search

on:
  workflow_dispatch:

jobs:
  search-etfs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Search ETF symbols
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import urllib.request
          import urllib.parse
          import sys

          api_key = os.environ.get("TWELVE_DATA_API_KEY")

          if not api_key:
              print("ERROR: API key missing")
              sys.exit(1)

          searches = [
              "CSPX",
              "CNDX",
              "iShares Core S&P 500 UCITS ETF",
              "iShares NASDAQ 100 UCITS ETF"
          ]

          for term in searches:
              params = urllib.parse.urlencode({
                  "symbol": term,
                  "outputsize": 30,
                  "show_plan": "true",
                  "apikey": api_key
              })

              url = "https://api.twelvedata.com/symbol_search?" + params

              print("\nSEARCH:", term)

              try:
                  request = urllib.request.Request(url)

                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.loads(response.read().decode())

                  matches = data.get("data", [])

                  if not matches:
                      print("NO MATCHES")
                      print("Message:", data.get("message", "No details"))
                  else:
                      for item in matches:
                          access = item.get("access", {})

                          print(
                              "Symbol:", item.get("symbol"),
                              "| Name:", item.get("instrument_name"),
                              "| Exchange:", item.get("exchange"),
                              "| MIC:", item.get("mic_code"),
                              "| Type:", item.get("instrument_type"),
                              "| Country:", item.get("country"),
                              "| Currency:", item.get("currency"),
                              "| Basic access:", access.get("plan", "Not reported")
                          )

              except Exception as error:
                  print("ERROR:", type(error).__name__)

              time.sleep(10)

          print("\nETF SYMBOL SEARCH COMPLETED")
          PY
