name: ETF GBX Same-ISIN Listing Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "research/etf_gbp_listing_audit.py"
      - "tests/test_etf_gbp_listing_audit.py"
      - ".github/workflows/etf_gbp_listing_audit.yml"
  workflow_dispatch:

concurrency:
  group: etf-gbp-same-isin-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Audit USD and GBX listings
        run: python research/etf_gbp_listing_audit.py
      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-gbp-listing-audit
          path: etf_gbp_listing_audit/
          if-no-files-found: ignore
