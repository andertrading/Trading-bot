name: Trading Bot 3.0 - Daily Swing Scanner (M15 manual lab)

on:
  schedule:
    # Production MVP: daily swing only, after UTC daily crypto close.
    # M15 is available only through a deliberate manual dispatch for lab use.
    - cron: "8 0 * * *"
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Temporalidad que se analizará"
        required: true
        type: choice
        options:
          - 15m
          - 1d
        default: 1d

permissions:
  contents: read

concurrency:
  group: trading-bot-scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    # Explicit opt-in prevents API usage until credentials and storage are ready.
    # Scheduled runs require repository opt-in. A deliberate manual
    # dispatch is also allowed for paper-only validation without enabling
    # recurring automation; alert and strategy gates remain independent.
    if: ${{ vars.SIGNAL_AUTOMATION_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SIGNAL_ALERTS_ENABLED: ${{ vars.SIGNAL_ALERTS_ENABLED }}
      SCAN_TIMEFRAME: ${{ github.event_name == 'workflow_dispatch' && inputs.timeframe || (github.event.schedule == '8 0 * * *' && '1d' || '15m') }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar configuración sin revelar secretos
        run: |
          python - <<'PY'
          import os
          required = [
              "TWELVE_DATA_API_KEY",
              "UPSTASH_REDIS_REST_URL",
              "UPSTASH_REDIS_REST_TOKEN",
          ]
          if os.environ["SCAN_TIMEFRAME"] == "1d":
              required.append("EODHD_API_KEY")
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit("Faltan GitHub Actions secrets: " + ", ".join(missing))
          print("Credenciales requeridas presentes; valores ocultos.")
          print("Temporalidad:", os.environ["SCAN_TIMEFRAME"])
          print("Alertas Telegram activas:", os.getenv("SIGNAL_ALERTS_ENABLED", "false").lower() == "true")
          PY

      - name: Ejecutar escaneo y seguimiento
        run: python scheduled_scan.py --timeframe "$SCAN_TIMEFRAME"
