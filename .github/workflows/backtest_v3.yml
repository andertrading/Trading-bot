
name: Trading Bot 3.0 - Backtest

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "backtest_v3.py"
      - "strategies.py"
      - "indicators.py"
      - "config.py"
      - "requirements.txt"
      - ".github/workflows/backtest_v3.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar versiones
        run: |
          python --version
          python -c "import pandas, numpy, yfinance; print('Pandas:', pandas.__version__); print('NumPy:', numpy.__version__); print('yfinance:', yfinance.__version__)"

      - name: Ejecutar backtest
        run: python backtest_v3.py

      - name: Comprobar resultados
        run: |
          test -f operaciones_backtest_v3.csv
          test -f resultados_backtest_v3.csv
          test -f errores_backtest_v3.csv

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-backtest-v3
          path: |
            operaciones_backtest_v3.csv
            resultados_backtest_v3.csv
            errores_backtest_v3.csv
          if-no-files-found: warn
          retention-days: 30
