
name: Trading Bot 3.0 - Backtest

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "backtest_v3.py"
      - "data_engine.py"
      - "eodhd_provider.py"
      - "transaction_costs.py"
      - "strategies.py"
      - "indicators.py"
      - "config.py"
      - "requirements.txt"
      - ".github/workflows/backtest_v3.yml"

  push:
    branches:
      - main
    paths:
      - "backtest_v3.py"
      - "data_engine.py"
      - "eodhd_provider.py"
      - "transaction_costs.py"
      - "strategies.py"
      - "indicators.py"
      - "config.py"
      - "requirements.txt"
      - ".github/workflows/backtest_v3.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BACKTEST_DATA_MODE: download
      BACKTEST_SNAPSHOT_DIR: historicos_backtest_v3

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar versiones
        run: |
          python --version
          python -c "import pandas, numpy, yfinance; print('Pandas:', pandas.__version__); print('NumPy:', numpy.__version__); print('yfinance:', yfinance.__version__)"

      - name: Ejecutar backtest
        run: python backtest_v3.py

      - name: Comprobar resultados
        run: |
          set -e

          test -f operaciones_backtest_v3.csv
          test -f resultados_backtest_v3.csv
          test -f errores_backtest_v3.csv
          test -f resumen_operaciones_v3.csv
          test -f diagnostico_senales_v3.csv
          test -f velas_ohlc_excluidas_v3.csv
          test -f rechazos_rr_backtest_v3.csv
          test -f senales_solapadas_v3.csv
          test -f costes_backtest_v3.csv

          echo "Todos los CSV obligatorios están disponibles."

      - name: Comprobar históricos reproducibles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          directory = Path("historicos_backtest_v3")
          manifest = directory / "manifest.json"

          if not manifest.is_file():
              raise SystemExit(
                  "No se ha generado historicos_backtest_v3/manifest.json"
              )

          with open(manifest, encoding="utf-8") as file:
              snapshots = json.load(file)

          if not isinstance(snapshots, list):
              raise SystemExit("El manifiesto no contiene una lista.")

          if not snapshots:
              raise SystemExit("El manifiesto no contiene históricos.")

          for item in snapshots:
              csv_path = directory / item["csv_file"]
              metadata_path = directory / (
                  item["asset"] + "__" + item["timeframe"] + ".json"
              )

              if not csv_path.is_file():
                  raise SystemExit(
                      f"Falta el histórico: {csv_path}"
                  )

              if not metadata_path.is_file():
                  raise SystemExit(
                      f"Faltan los metadatos: {metadata_path}"
                  )

              if not item.get("sha256"):
                  raise SystemExit(
                      f"Falta SHA-256: {csv_path}"
                  )

          print(f"Snapshots verificados: {len(snapshots)}")
          PY

      - name: Generar informe técnico ampliado
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import pandas as pd
          from pathlib import Path

          FILES = [
              "operaciones_backtest_v3.csv",
              "resultados_backtest_v3.csv",
              "errores_backtest_v3.csv",
              "resumen_operaciones_v3.csv",
              "diagnostico_senales_v3.csv",
              "velas_ohlc_excluidas_v3.csv",
              "rechazos_rr_backtest_v3.csv",
              "senales_solapadas_v3.csv",
              "costes_backtest_v3.csv",
          ]

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          def clean(value):
              if pd.isna(value):
                  return ""
              return str(value).replace("|", "\\|").replace("\n", " ")

          def markdown_table(df, max_rows=40):
              if df is None or df.empty:
                  return "_Sin datos disponibles._\n"

              shown = df.head(max_rows)
              columns = list(shown.columns)

              lines = [
                  "| " + " | ".join(clean(c) for c in columns) + " |",
                  "| " + " | ".join(["---"] * len(columns)) + " |",
              ]

              for _, row in shown.iterrows():
                  lines.append(
                      "| " + " | ".join(clean(row[c]) for c in columns) + " |"
                  )

              if len(df) > max_rows:
                  lines.append(
                      f"\n_Se muestran {max_rows} de {len(df)} filas._"
                  )

              return "\n".join(lines) + "\n"

          def find_column(df, terms):
              for column in df.columns:
                  name = str(column).lower().replace("_", "").replace(" ", "")
                  if any(term in name for term in terms):
                      return column
              return None

          def section(title, df, max_rows=40):
              return (
                  f"\n## {title}\n\n"
                  + markdown_table(df, max_rows)
              )

          report = [
              "# INFORME TÉCNICO - TRADING BOT 3.0",
              "",
              "Informe generado automáticamente a partir de los CSV del backtest.",
              "",
              "## 1. Configuración de ejecución",
              "",
              f"- Modo de datos: **{os.getenv('BACKTEST_DATA_MODE', 'unknown')}**",
              f"- Directorio de snapshots: **{os.getenv('BACKTEST_SNAPSHOT_DIR', 'unknown')}**",
              "- Proveedores históricos: según el enrutamiento del motor live (Twelve Data, Yahoo Finance o EODHD).",
              "- Ajuste de precios: política nativa de cada proveedor; equivalencia entre fuentes no verificada.",
              "- Costes: modelo eToro parcial con tarifas públicas base; spread bid-ask real, conversión y financiación variable quedan sin precio cuando faltan datos.",
              "- Sizing: cantidad hipotética por operación para estimar el efecto de comisiones; no representa una cartera simultánea.",
              "",
          ]

          data = {}

          report.append("## 2. Estado de los archivos")

          for filename in FILES:
              if os.path.exists(filename):
                  try:
                      df = pd.read_csv(filename)
                      data[filename] = df
                      report.append(
                          f"- **{filename}:** disponible, "
                          f"{len(df)} filas y {len(df.columns)} columnas."
                      )
                  except Exception as exc:
                      report.append(
                          f"- **{filename}:** error de lectura: {exc}"
                      )
              else:
                  report.append(f"- **{filename}:** no generado.")

          results = data.get("resultados_backtest_v3.csv")

          if results is not None and not results.empty:
              report.append("\n## 3. Resultados generales")

              numeric_columns = [
                  "operaciones",
                  "ganadoras",
                  "perdedoras",
                  "total_R",
                  "resultado_R",
                  "drawdown_max_R",
              ]

              for column in numeric_columns:
                  if column in results.columns:
                      results[column] = pd.to_numeric(
                          results[column], errors="coerce"
                      )

              if "tipo" in results.columns:
                  total_rows = results[
                      results["tipo"].astype(str).str.upper().str.contains(
                          "TOTAL", na=False
                      )
                  ]

                  if not total_rows.empty:
                      report.append(markdown_table(total_rows, 20))

                  asset_rows = results[
                      results["tipo"].astype(str).str.upper().str.contains(
                          "ACTIVO_TEMPORALIDAD", na=False
                      )
                  ]

                  if asset_rows.empty:
                      asset_rows = results

                  report.append(
                      "\n### Resultados por activo y temporalidad\n"
                  )
                  report.append(markdown_table(asset_rows, 40))
              else:
                  report.append(markdown_table(results, 40))

          monthly = data.get("resumen_operaciones_v3.csv")

          if monthly is not None:
              report.append(
                  section(
                      "4. Resumen de operaciones y evolución temporal",
                      monthly,
                      50,
                  )
              )

          diagnostics = data.get("diagnostico_senales_v3.csv")

          if diagnostics is not None and not diagnostics.empty:
              report.append("\n## 5. Diagnóstico de señales")

              status_col = find_column(
                  diagnostics, ["signalstatus", "estado", "status"]
              )

              reason_col = find_column(
                  diagnostics, ["rejectionreason", "motivo", "reason"]
              )

              asset_col = find_column(
                  diagnostics, ["activo", "asset", "ticker", "symbol"]
              )

              timeframe_col = find_column(
                  diagnostics, ["temporalidad", "timeframe"]
              )

              if status_col:
                  report.append("\n### Señales por estado\n")
                  counts = (
                      diagnostics.groupby(status_col, dropna=False)
                      .size()
                      .reset_index(name="cantidad")
                      .sort_values("cantidad", ascending=False)
                  )
                  report.append(markdown_table(counts, 50))

              if reason_col:
                  report.append("\n### Motivos registrados\n")
                  reasons = (
                      diagnostics.groupby(reason_col, dropna=False)
                      .size()
                      .reset_index(name="cantidad")
                      .sort_values("cantidad", ascending=False)
                  )
                  report.append(markdown_table(reasons, 50))

              if asset_col and timeframe_col and status_col:
                  report.append(
                      "\n### Estados por activo y temporalidad\n"
                  )
                  grouped = (
                      diagnostics.groupby(
                          [asset_col, timeframe_col, status_col],
                          dropna=False,
                      )
                      .size()
                      .reset_index(name="cantidad")
                  )
                  report.append(markdown_table(grouped, 100))

              report.append(
                  section(
                      "Muestra de señales diagnosticadas",
                      diagnostics,
                      15,
                  )
              )

          overlaps = data.get("senales_solapadas_v3.csv")

          if overlaps is not None:
              report.append(
                  section(
                      "6. Señales no simuladas por solapamiento",
                      overlaps,
                      30,
                  )
              )

          rr_rejections = data.get("rechazos_rr_backtest_v3.csv")

          if rr_rejections is not None:
              report.append(
                  section(
                      "7. Rechazos por riesgo/recompensa",
                      rr_rejections,
                      30,
                  )
              )

          operations = data.get("operaciones_backtest_v3.csv")

          if operations is not None and not operations.empty:
              report.append("\n## 8. Operaciones ejecutadas")
              report.append(
                  f"\nTotal de registros: **{len(operations)}**.\n"
              )

              exit_col = find_column(
                  operations, ["exitreason", "motivosalida", "salida"]
              )

              if exit_col:
                  exits = (
                      operations.groupby(exit_col, dropna=False)
                      .size()
                      .reset_index(name="cantidad")
                      .sort_values("cantidad", ascending=False)
                  )
                  report.append("### Tipos de salida\n")
                  report.append(markdown_table(exits, 30))

              report.append(
                  section("Muestra de operaciones", operations, 10)
              )

          cost_data = data.get("costes_backtest_v3.csv")
          if cost_data is not None:
              report.append(
                  section(
                      "9. Costes eToro estimados por operación",
                      cost_data,
                      40,
                  )
              )

          errors = data.get("errores_backtest_v3.csv")

          if errors is not None:
              report.append(
                  section("10. Errores del backtest", errors, 30)
              )

          excluded = data.get("velas_ohlc_excluidas_v3.csv")

          if excluded is not None:
              report.append(
                  section(
                      "11. Velas OHLC excluidas",
                      excluded,
                      30,
                  )
              )

          snapshot_dir = Path("historicos_backtest_v3")
          manifest_path = snapshot_dir / "manifest.json"

          report.append("\n## 12. Históricos reproducibles")

          if manifest_path.is_file():
              try:
                  with open(manifest_path, encoding="utf-8") as file:
                      snapshots = json.load(file)

                  report.append(
                      f"- Snapshots registrados: **{len(snapshots)}**."
                  )

                  for item in snapshots:
                      report.append(
                          f"- {item.get('asset')} "
                          f"({item.get('timeframe')}): "
                          f"{item.get('row_count')} velas; "
                          f"SHA-256 `{item.get('sha256', '')}`."
                      )
              except Exception as exc:
                  report.append(
                      f"- Error leyendo manifiesto: {exc}"
                  )
          else:
              report.append("- No se ha encontrado el manifiesto.")

          report.extend([
              "",
              "## 13. Consideraciones",
              "",
              "- Los resultados en R no representan por sí solos "
              "una rentabilidad monetaria de cartera.",
              "- El resultado tras comisiones conocidas es parcial: no incluye spreads bid-ask variables ni cargos de financiación o conversión no confirmados.",
              "- Las series intradía se normalizan sin ajuste; las diarias se normalizan por splits, sin ajuste por dividendos. La paridad de precios ejecutables con eToro no está garantizada.",
              "- Una ejecución verde no demuestra rentabilidad futura.",
              "",
              "## Fin del informe",
          ])

          with open(summary_path, "a", encoding="utf-8") as file:
              file.write("\n".join(report))

          print("Informe técnico ampliado generado.")
          PY

      - name: Guardar resultados descargables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-backtest-v3
          path: |
            operaciones_backtest_v3.csv
            resultados_backtest_v3.csv
            errores_backtest_v3.csv
            resumen_operaciones_v3.csv
            diagnostico_senales_v3.csv
            velas_ohlc_excluidas_v3.csv
            rechazos_rr_backtest_v3.csv
            senales_solapadas_v3.csv
            costes_backtest_v3.csv
            historicos_backtest_v3/
          if-no-files-found: warn
          retention-days: 30
