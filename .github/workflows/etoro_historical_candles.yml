name: eToro Historical Market Candles (Read-Only)

on:
  push:
    branches:
      - main
    paths:
      - etoro_historical_candles.py
      - etoro_yahoo_reconciliation.py
      - etoro_read_only.py
      - .github/workflows/etoro_historical_candles.yml
  schedule:
    - cron: "15 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etoro-historical-market-candles
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
      ETORO_HISTORICAL_EVIDENCE_OUTPUT: artifacts/etoro_historical_candles.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check credentials without exposing values
        run: |
          python - <<'PY'
          import os
          missing = [key for key in ("ETORO_API_KEY", "ETORO_USER_KEY") if not os.getenv(key)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          print("eToro credentials are present; values are not displayed.")
          PY
      - name: Capture historical market candles only
        continue-on-error: true
        run: python etoro_historical_candles.py --interval 1d --count 1000 --min-candles 220
      - name: Upload historical candle evidence
        if: always() && hashFiles('artifacts/etoro_historical_candles.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: etoro-historical-market-candles
          path: artifacts/etoro_historical_candles.json
          if-no-files-found: error
          retention-days: 90
      - name: Compare usable eToro OHLC with secondary Yahoo history
        if: always() && hashFiles('artifacts/etoro_historical_candles.json') != ''
        continue-on-error: true
        run: |
          python etoro_yahoo_reconciliation.py \
            --input artifacts/etoro_historical_candles.json \
            --output artifacts/etoro_yahoo_reconciliation.json
      - name: Upload secondary price comparison
        if: always() && hashFiles('artifacts/etoro_yahoo_reconciliation.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: etoro-yahoo-price-comparison
          path: artifacts/etoro_yahoo_reconciliation.json
          if-no-files-found: error
          retention-days: 90
      - name: Evaluate historical capture status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/etoro_historical_candles.json")
          if not path.is_file():
              raise SystemExit("Historical candle report was not created.")
          report = json.loads(path.read_text(encoding="utf-8"))
          status = report.get("summary", {}).get("status")
          if status == "COMPLETE":
              print("All configured historical candle series passed collection checks.")
          elif status == "PARTIAL":
              print("::warning::Historical evidence is PARTIAL; conflicted/insufficient assets remain blocked.")
          else:
              raise SystemExit(f"Unexpected historical capture status: {status!r}")
          PY
