name: eToro Historical Market Candles (Read-Only)

on:
  push:
    branches:
      - main
    paths:
      - etoro_historical_candles.py
      - .github/workflows/etoro_historical_candles.yml
  schedule:
    - cron: "15 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etoro-historical-market-candles
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ETORO_API_KEY: \${{ secrets.ETORO_API_KEY }}
      ETORO_USER_KEY: \${{ secrets.ETORO_USER_KEY }}
      ETORO_HISTORICAL_EVIDENCE_OUTPUT: artifacts/etoro_historical_candles.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check credentials without exposing values
        run: |
          python - <<'PY'
          import os
          missing = [key for key in ("ETORO_API_KEY", "ETORO_USER_KEY") if not os.getenv(key)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          print("eToro credentials are present; values are not displayed.")
          PY
      - name: Capture historical market candles only
        run: python etoro_historical_candles.py --interval 1d --count 1000 --min-candles 220
      - name: Upload historical candle evidence
        if: always() && hashFiles('artifacts/etoro_historical_candles.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: etoro-historical-market-candles
          path: artifacts/etoro_historical_candles.json
          if-no-files-found: error
          retention-days: 90
