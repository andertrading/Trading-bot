name: Trading Bot 3.0 - Twelve Data Daily History Audit

on:
  workflow_dispatch:

concurrency:
  group: twelvedata-daily-history-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.2.3 numpy==2.2.6 requests==2.32.4 exchange-calendars==4.13.3
      - name: Audit ten Twelve Data daily histories
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python research/twelvedata_daily_history_audit.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twelvedata-daily-history-audit
          path: twelvedata_history_audit/
          if-no-files-found: warn
          retention-days: 30
